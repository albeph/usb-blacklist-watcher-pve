# usb-blacklist-watcher-pve — USB Advanced Protection (Udev Raw Node Block)
#
# This file defines blacklisted USB devices for which Advanced Protection
# is enabled. For each listed device, a Udev rule is generated in:
#   /etc/udev/rules.d/99-usb-blacklist-watcher-pve.rules
#
# The rule deletes the raw USB device node (/dev/bus/usb/XXX/YYY) upon
# detection while leaving kernel-managed device nodes (such as /dev/sdX
# or /dev/ttyACM0) completely intact. Without the raw USB node, neither
# root nor QEMU/KVM can issue USBDEVFS_DISCONNECT to detach the host
# kernel driver.
#
# ┌─────────────────────────────────────────────────────────────┐
# │  To manage Advanced Protection interactively, run:          │
# │      usb-blacklist-select-pve                               │
# │                                                             │
# │  To add/remove via CLI:                                     │
# │      usb-blacklist-select-pve --advanced-add 2e8a:0005      │
# │      usb-blacklist-select-pve --advanced-remove 2e8a:0005   │
# │      usb-blacklist-select-pve --advanced-list               │
# └─────────────────────────────────────────────────────────────┘
#
# FORMAT:
#   VENDOR:PRODUCT  # optional comment
#
#   - VENDOR and PRODUCT are 4-digit hexadecimal IDs (as shown by `lsusb`)
#   - Blank lines and lines starting with '#' are ignored
#   - Example:  0bda:0177  # Realtek Semiconductor Corp. USB2.0-CRW
#   - Example:  2e8a:0005  # MicroPython Board in FS mode
#
# SECURITY NOTE:
#   This file is readable and writable only by root (permissions 600).
#
