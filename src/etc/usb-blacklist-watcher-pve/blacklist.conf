# usb-blacklist-watcher-pve — USB Device Blacklist for Proxmox VE
#
# This file defines USB devices that must NEVER be passed through
# to any Proxmox VE virtual machine.
#
# ┌─────────────────────────────────────────────────────────────┐
# │  To manage the blacklist interactively, run:                │
# │      usb-blacklist-select                                   │
# │                                                             │
# │  To add/remove via CLI:                                     │
# │      usb-blacklist-select --add 2e8a:0005                   │
# │      usb-blacklist-select --remove 2e8a:0005                │
# │      usb-blacklist-select --list                            │
# └─────────────────────────────────────────────────────────────┘
#
# FORMAT:
#   VENDOR:PRODUCT  # optional comment
#
#   - VENDOR and PRODUCT are 4-digit hexadecimal IDs (as shown by `lsusb`)
#   - Blank lines and lines starting with '#' are ignored
#   - Example:  2e8a:0005  # MicroPython Board in FS mode
#   - Example:  0bda:8156  # Realtek USB 10/100/1G/2.5G LAN
#
# SECURITY NOTE:
#   This file is readable and writable only by root (permissions 600).
#   Its content governs a security enforcement mechanism on the Proxmox host.
#
