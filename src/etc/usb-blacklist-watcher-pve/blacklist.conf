# usb-blacklist-watcher-pve — Blacklist dispositivi USB per Proxmox VE
#
# Questo file definisce i dispositivi USB che NON possono mai essere
# assegnati in passthrough a una macchina virtuale Proxmox VE.
#
# ┌─────────────────────────────────────────────────────────────┐
# │  Per gestire la blacklist in modo interattivo, usa:          │
# │      usb-blacklist-select                                    │
# │                                                              │
# │  Per aggiungere/rimuovere via CLI:                           │
# │      usb-blacklist-select --add 2e8a:0005                    │
# │      usb-blacklist-select --remove 2e8a:0005                 │
# │      usb-blacklist-select --list                             │
# └─────────────────────────────────────────────────────────────┘
#
# FORMATO:
#   VENDOR:PRODUCT  # commento opzionale
#
#   - VENDOR e PRODUCT sono ID esadecimali a 4 cifre (come da `lsusb`)
#   - Le righe vuote e quelle che iniziano con '#' vengono ignorate
#   - Esempio:  2e8a:0005  # MicroPython Board in FS mode
#   - Esempio:  0bda:8156  # Realtek USB 10/100/1G/2.5G LAN
#
# NOTA SULLA SICUREZZA:
#   Questo file è leggibile e scrivibile solo da root (permessi 600).
#   Il suo contenuto guida un meccanismo di sicurezza sull'host Proxmox.
#
